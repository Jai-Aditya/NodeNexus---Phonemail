# nginx inside the `web` container: serves the built web client and passes /api/ and /twilio/
# to the api (API_UPSTREAM, default api:3000; filled in by the nginx image at start).
# In production, the host's nginx (https) sits in front and forwards here.

# https as seen by the visitor: from the host nginx in front, or this connection itself.
map $http_x_forwarded_proto $visitor_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /srv/web;
    index index.html;
    client_max_body_size 27m;   # 25 MB attachments plus the form around them

    # The visitor's real address. Requests come through the host nginx (or Docker's port
    # forwarding), whose X-Forwarded-For names the visitor; only those private networks are
    # trusted to say so. The api then gets exactly one address, the visitor's.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The page may only run its own scripts and talk to its own server. Emails can show images
    # from https sites; styles allow inline attributes (React's style=...).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Live updates: a long-lived stream that must reach the browser as it happens.
    # The installable-app manifest, with its proper type (phones check it before offering "Install").
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location = /api/events {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $visitor_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://${API_UPSTREAM};   # no trailing slash: the api serves /api/... itself
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $visitor_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering off;          # uploads stream through to the api
        proxy_read_timeout 5m;
    }

    location /twilio/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $visitor_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Built files have their content hash in the name: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the app (one page); always check for a new version.
    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
