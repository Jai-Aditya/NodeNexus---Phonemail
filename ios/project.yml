# XcodeGen spec for the PhoneMail iOS app. Generate the Xcode project on the Mac with:
#   xcodegen generate        (creates PhoneMail.xcodeproj; the .xcodeproj is not kept in the repo)
name: PhoneMail
options:
  bundleIdPrefix: org.jaiaditya
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""          # set once the Apple Developer account is active
    CODE_SIGN_STYLE: Automatic
    # Strings are looked up by their English text (L("...")), never by generated symbols. Xcode 27.1 generates them by
    # default and fails on keys that differ only in punctuation ("Snooze" / "Snooze…").
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    # The iPhone app's ID; the watch app's is this + ".watchkitapp". build.sh device swaps it for a .dev ID.
    PM_APP_ID: org.jaiaditya.phonemail
targets:
  PhoneMail:
    type: application
    platform: iOS
    # Shared: pure code the watch app uses too (push payloads, the watch's chat models).
    sources: [PhoneMail, Shared]
    dependencies:
      # The Apple Watch app ships inside the iPhone app (Watch/PhoneMailWatch.app).
      - target: PhoneMailWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PM_APP_ID)
        PRODUCT_NAME: PhoneMail
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad (the store then asks for iPad screenshots too)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhoneMail/Info.plist
        # Push (aps-environment=development; the App Store export re-signs it as production). Needs a paid team:
        # build.sh device ... free leaves it out.
        CODE_SIGN_ENTITLEMENTS: PhoneMail/PhoneMail.entitlements
      configs:
        # Debug talks to the staging Pi on the home LAN (the public address is unreachable from inside it).
        Debug:
          PM_API_BASE: "http://10.28.28.33:8090/api"
        Release:
          PM_API_BASE: "https://mail.phonemail.net/api"
  # The Apple Watch app (one target, watchOS 10+). It signs in with the token the iPhone sends it.
  PhoneMailWatch:
    type: application
    platform: watchOS
    sources:
      - PhoneMailWatch
      - Shared
      - PhoneMail/Data/Keychain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PM_APP_ID).watchkitapp
        PRODUCT_NAME: PhoneMailWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhoneMailWatch/Info.plist
        SKIP_INSTALL: YES
  PhoneMailTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhoneMailTests]
    dependencies:
      - target: PhoneMail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Walks through the app like a person (against the staging api) and saves screenshots to $PM_SHOTS.
  PhoneMailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PhoneMailUITests]
    dependencies:
      - target: PhoneMail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhoneMail
schemes:
  PhoneMail:
    build:
      targets:
        PhoneMail: all
    test:
      targets: [PhoneMailTests, PhoneMailUITests]
  PhoneMailWatch:
    build:
      targets:
        PhoneMailWatch: all
